<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Carpet cleaning and maid service across Chicago. Residential, commercial and industrial cleaning from Israel Carpet Cleaning Co. Call (773) 895-9304 for a quote."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico?" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Carpet Cleaning in Chicago | Israel Carpet Cleaning Co.</title>
    <link rel="canonical" href="https://cesarous.github.io/Israel-Carpet-Cleaning-Co/" />
    <meta property="og:title" content="Carpet Cleaning in Chicago | Israel Carpet Cleaning Co." />
    <meta property="og:description" content="Carpet cleaning and maid service across Chicago. Residential, commercial and industrial cleaning. Call (773) 895-9304 for a quote." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cesarous.github.io/Israel-Carpet-Cleaning-Co/" />
    <meta property="og:image" content="https://cesarous.github.io/Israel-Carpet-Cleaning-Co/ICCS_logo.png" />

    <!--
      Local search is how a cleaning business gets found, and it runs on
      structured data rather than page copy. Hours and a street address are
      left out on purpose - they are not published anywhere I could confirm,
      and inventing them would be worse than omitting them.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Israel Carpet Cleaning Co.",
      "description": "Carpet cleaning and maid service for homes and businesses across Chicago.",
      "url": "https://cesarous.github.io/Israel-Carpet-Cleaning-Co/",
      "image": "https://cesarous.github.io/Israel-Carpet-Cleaning-Co/ICCS_logo.png",
      "telephone": "+1-773-895-9304",
      "email": "monroyisrael@yahoo.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Chicago",
        "addressRegion": "IL",
        "addressCountry": "US"
      },
      "areaServed": {
        "@type": "City",
        "name": "Chicago"
      },
      "sameAs": [
        "https://www.instagram.com/israelcarpetcleaningco/",
        "https://www.facebook.com/israelcarpetcleaning"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Cleaning services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Residential Cleaning Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Commercial Cleaning Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Industrial Cleaning Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Maid Services" } }
        ]
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
